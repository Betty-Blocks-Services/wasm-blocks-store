[workspace]
members = ["functions/*/*"]
resolver = "1"

[workspace.package]
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wit-bindgen = "0.58.0"
wasmtime-testing-helper = { git = "https://github.com/bettyblocks/wasmtime-testing-helper" }
