[package]
name = "exchange-code-for-tokens"
version = "1.0.0"
edition.workspace = true
build = "../../../build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = { workspace = true }
# Pinned independently of the workspace's wit-bindgen (0.58): `waki` and `wasi` below are the
# exact combination proven working against wasi:http in bettyblocks/native-wasm-components'
# own HTTP step, and `waki`'s own generated bindings must match this crate's `wasi:http` bindings
# byte-for-byte (see the `with:` remap in src/lib.rs) — so this trio is pinned together.
wit-bindgen = "0.42.0"
wasi = "0.14.2"
waki = "0.5.1"
url = "2.5.4"

[dev-dependencies]
wasmtime-testing-helper = { workspace = true, features = ["http"] }
